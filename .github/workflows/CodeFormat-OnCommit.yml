---
name: Auto Format C# Files

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      # - dev  # Reagiert auf den dev-Branch selbst
      - '**MMPFO-100*'  # Reagiert auf deinen Testbranch
    paths:
      # Wird nur getriggert, wenn sich C#-Dateien ändern
      - '**/*.cs'

jobs:
  format:
    runs-on: ubuntu-latest

    # Berechtigungen, damit der Workflow Code zurückschreiben darf
    permissions:
      contents: write

    steps:
      # 1. Repository auschecken
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      # 2. .NET SDK einrichten
      - name: Setup .NET
        uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: '8.0.x'  # Passe dies an deine genutzte .NET-Version an

      # 3. Code formatieren
      - name: Run dotnet format
        run: dotnet format whitespace --include-generated || dotnet format

      # 4. Änderungen committen und pushen
      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto format C# files [skip ci]"
          file_pattern: '**/*.cs'
